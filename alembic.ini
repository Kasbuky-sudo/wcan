# Alembic Configuration - BianZhouWenXin Database Migration
# Usage:
#   alembic revision --autogenerate -m "description"   # Generate migration
#   alembic upgrade head                                # Apply migrations
#   alembic current                                     # Show current version
#   alembic history                                     # Show migration history
#   alembic downgrade -1                                # Rollback one version

[alembic]
# Migration scripts directory
script_location = migrations

# Database connection string (keep in sync with config.yaml db field)
# Environment variable WCAN_DB takes priority, then config.yaml, then this default
sqlalchemy.url = sqlite:///data/articles.db

# Template
template = generic

# Timezone
timezone = Asia/Shanghai

# Version table name
version_table = alembic_version

# File naming template: timestamp_description
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Migration script encoding
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
