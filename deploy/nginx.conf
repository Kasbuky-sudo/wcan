# 编舟文心 —— 反向代理示例（nginx）
#
# 作用：
#   1. HTTPS 终止
#   2. HTTP Basic Auth 登录（本应用自身没有登录鉴权，务必在这一层加上）
#   3. 传递真实客户端 IP（地区封锁功能依赖它，缺了会静默失效）
#
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/wcan.conf
#   sudo htpasswd -c /etc/nginx/.htpasswd wcan     # 生成共享账号，部员共用
#   # 修改 server_name 为你的域名，然后：
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name wcan.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wcan.example.com;

    # 证书用 certbot 签发：certbot --nginx -d wcan.example.com
    ssl_certificate     /etc/letsencrypt/live/wcan.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wcan.example.com/privkey.pem;

    # ===== 登录保护（应用自身没有登录，必须靠这一层）=====
    auth_basic           "编舟文心";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 上传 Word 替换、更新包会用到
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:10015;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 爬取/同步是长任务，超时给足
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_buffering       off;
    }
}

# 说明：
# - 若前面还套了 Cloudflare，上面的 X-Real-IP 会变成 CF 节点地址。
#   本应用会优先读 Cloudflare 的 CF-Connecting-IP 头，该头默认会被透传，
#   所以无需额外配置即可正确识别客户端地区；反过来，如果你【不】想暴露
#   真实 IP 给应用，就要显式清除这些头。
# - Basic Auth 的账号密码是明文 base64，必须全程 HTTPS。
# - 若用 Caddy，配置更短，且自动申请证书并自动设置 X-Forwarded-For：
#     wcan.example.com {
#         basic_auth {
#             wcan <bcrypt-hash>    # caddy hash-password 生成
#         }
#         reverse_proxy 127.0.0.1:10015
#     }
